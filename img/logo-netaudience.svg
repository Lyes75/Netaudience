<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 44" role="img" aria-label="netaudience">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0052D4"/>
      <stop offset="100%" stop-color="#2196F3"/>
    </linearGradient>
  </defs>
  <!-- Back dark frame (bottom-left) -->
  <rect x="0" y="8" width="28" height="28" rx="6" fill="#1c2233"/>
  <rect x="4" y="12" width="20" height="20" rx="3.5" fill="white"/>
  <!-- Front blue frame (top-right, overlapping) -->
  <rect x="10" y="2" width="28" height="28" rx="6" fill="url(#blueGrad)"/>
  <rect x="14" y="6" width="20" height="20" rx="3.5" fill="white"/>
  <!-- Wordmark -->
  <text x="48" y="29" font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="20" letter-spacing="-0.4">
    <tspan fill="#0066FF">net</tspan><tspan fill="#1c2233">audience</tspan>
  </text>
</svg>
