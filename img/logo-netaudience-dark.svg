<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 44" role="img" aria-label="netaudience">
  <defs>
    <linearGradient id="blueGradDark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0052D4"/>
      <stop offset="100%" stop-color="#2196F3"/>
    </linearGradient>
  </defs>
  <!-- Back dark frame (lighter stroke on dark bg) -->
  <rect x="0" y="8" width="28" height="28" rx="6" fill="transparent" stroke="rgba(255,255,255,0.25)" stroke-width="2.5"/>
  <!-- Front blue frame -->
  <rect x="10" y="2" width="28" height="28" rx="6" fill="url(#blueGradDark)"/>
  <rect x="14" y="6" width="20" height="20" rx="3.5" fill="transparent" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <!-- Wordmark -->
  <text x="48" y="29" font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="20" letter-spacing="-0.4">
    <tspan fill="#38A1F3">net</tspan><tspan fill="white">audience</tspan>
  </text>
</svg>
